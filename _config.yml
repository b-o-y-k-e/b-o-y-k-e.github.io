###########################################################
### Beautiful Jekyll - configuration for Boyke's blog
###########################################################

# --- Required ---
title: boykes blog
author: boyke

# --- Navigation bar links ---
navbar-links:
  About Me: "aboutme"

# --- Logo ---
avatar: "/assets/img/avatar-icon.png"
round-avatar: true

# --- Footer social links ---
social-network-links:
  email: "boy@boyke.christmas"
  rss: true
  discord: users/1231964266748317758
  github: b-o-y-k-e

# --- RSS ---
rss-description: blog about stuff i like

# --- General ---
title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: true
navbar-var-length: false

# --- Colours: dark forest green + mint accent ---
page-col: "#0F1A15"
text-col: "#DDE8E0"
link-col: "#5FD39A"
hover-col: "#A6F0CB"
navbar-col: "#16261F"
navbar-text-col: "#DDE8E0"
navbar-border-col: "#244035"
footer-col: "#16261F"
footer-text-col: "#9DB5A8"
footer-link-col: "#DDE8E0"
footer-hover-col: "#5FD39A"

# --- Misc ---
date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here --- #
#################################################################################

timezone: "Europe/Amsterdam"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
